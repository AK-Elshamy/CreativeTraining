<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Contact</title>

    <link rel="icon" href="resources/favicon.ico">

</head>

<body>

<center>

<h1>Contact Me</h1>

<form action="Home.html" method="get">

<table>

<tr>

<td>Name</td>

<td>
<input type="text" name="name">
</td>

</tr>

<tr>

<td>Your Opinion</td>

<td>

<input type="radio" name="opinion" value="Good">
Good

<input type="radio" name="opinion" value="Bad">
Bad

</td>

</tr>

<tr>

<td>Gender</td>

<td>

<input type="radio" name="gender" value="Male">
Male

<input type="radio" name="gender" value="Female">
Female

</td>

</tr>

<tr>

<td>Marital Status</td>

<td>

<select name="status">

<option>Other</option>

<option>Single</option>

<option>Married</option>

</select>

</td>

</tr>

<tr>

<td>How did you know my website?</td>

<td>

<select multiple size="4">

<option>Facebook</option>

<option>X (Twitter)</option>

<option>Friend</option>

<option>Google</option>

<option>University</option>

</select>

</td>

</tr>

<tr>

<td>Email</td>

<td>

<input
type="email"
name="email">

</td>

</tr>

<tr>

<td>Subject</td>

<td>

<input
type="text"
name="subject">

</td>

</tr>

<tr>

<td>Message</td>

<td>

<textarea
rows="6"
cols="40">
</textarea>

</td>

</tr>

<tr>

<td></td>

<td>

<input
type="submit"
value="Send">

</td>

</tr>

</table>

</form>

<br>

<a href="Home.html">

Back To Home

</a>

</center>

</body>

</html>
