<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Contact Form</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <h1>Payment Form</h1>

    <p>Required fields are followed by <b>*</b>.</p>

    <h2>Contact Information</h2>

    <div id="form">

        <fieldset>

            <legend>Title</legend>

            <input type="radio" name="title" value="Mister" checked>
            Mister

            <br>

            <input type="radio" name="title" value="Miss">
            Miss

        </fieldset>

        <br>

        <label>Name : *</label>

        <input type="text" id="name">

        <br><br>

        <label>E-mail : *</label>

        <input type="email" id="email">

        <br><br>

        <label>Card Type :</label>

        <select id="card">

            <option>Visa</option>
            <option>Master Card</option>

        </select>

        <br><br>

        <input type="checkbox" id="save">

        save data to use

        <br><br>

        <button onclick="addUser()">

            Add User

        </button>

    </div>

    <br>

    <label>search:</label>

    <input type="text" id="search" placeholder="search by Name" onkeyup="searchUser()">

    <h3>List of User</h3>

    <table>

        <thead>

            <tr>

                <th>Name</th>

                <th>Email</th>

                <th>Card</th>

                <th>Save</th>

                <th>Edit</th>

                <th>Delete</th>

            </tr>

        </thead>

        <tbody id="users">

        </tbody>

    </table>

    <script src="script.js"></script>
</body>

</html>
