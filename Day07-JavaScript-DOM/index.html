<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Login Page</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h2>Login Page</h2>

        <input type="text" id="username" placeholder="Username">

        <br><br>

        <input type="password" id="password" placeholder="Password">

        <br><br>

        <button onclick="login()">

            Login

        </button>

        <h3 id="result"></h3>

    </div>



    <div>
        <hr>

        <h2>Merge Arrays</h2>

        <input type="text" id="array1" placeholder="1,6,5,9,1,2">

        <br><br>

        <input type="text" id="array2" placeholder="5,6,3,1,9">

        <br><br>

        <button onclick="mergeArrays()">

            Merge

        </button>

        <h3 id="output"></h3>
    </div>






    <div>
        <hr>

        <h2>Todo List</h2>

        <input type="text" id="taskName" placeholder="Enter Task">

        <button onclick="addTask()">

            Add Task

        </button>

        <ul id="taskList">

        </ul>
    </div>



    <script src="script.js"></script>




</body>

</html>
